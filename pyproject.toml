[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mv-lab"
version = "0.2.0"
description = "Model validation toolkit applied to a VaR/ES engine and a PD model: coverage and ES backtests, discrimination, calibration and stability, findings graded by a published rubric."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mvlab = "mvlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
