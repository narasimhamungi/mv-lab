name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests (none may be skipped)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v -p no:cacheprovider | tee pytest.log
          if grep -qiE "[0-9]+ skipped" pytest.log; then echo "tests were skipped"; exit 1; fi
      - name: The committed VaR report rebuilds byte for byte from the committed snapshot
        run: |
          mvlab validate var
          git diff --exit-code -- outputs/var_validation.md outputs/var_results.csv outputs/var_findings.csv
      - name: Demo on invented inputs with planted defects
        run: mvlab demo --out /tmp/demo
